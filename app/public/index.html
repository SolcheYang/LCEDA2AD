<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>立创元件 → Altium</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="topbar">
  <div class="wrap">
    <h1>立创元件 → Altium</h1>
    <p class="sub">输入型号或立创编号 → 直接写入目标 SchLib / PcbLib；可选保留临时文档与单件库。</p>
  </div>
</header>

<main class="wrap">

  <section class="card">
    <h2><span class="num">1</span>元件</h2>
    <div class="row">
      <input id="q" type="text" autocomplete="off" spellcheck="false"
             placeholder="元件名称 / 型号 / 立创编号，例如 C25804、BQ7693003DBTR">
      <button id="search-btn" class="primary" type="button">搜索</button>
    </div>
    <p id="search-status" class="hint">支持 C 编号或名称；也可以直接生成。</p>
    <div id="candidates" class="candidates" hidden></div>
  </section>

  <section class="card">
    <h2><span class="num">2</span>输出位置</h2>
    <div class="fields">
      <div class="field">
        <label for="outDir">输出目录</label>
        <div class="path-row">
          <input id="outDir" type="text" spellcheck="false" placeholder="E:\EDA2Altium\out">
          <button id="browse-outDir" class="browse" type="button">浏览…</button>
        </div>
        <div class="saved-row">
          <select id="outDirSaved" aria-label="常用输出目录">
            <option value="">常用目录…</option>
          </select>
          <button id="save-outDir" class="link" type="button">保存当前</button>
          <button id="del-outDir" class="link" type="button">删除</button>
        </div>
      </div>

      <div class="field">
        <label for="schLib">目标原理图库 SchLib</label>
        <div class="path-row">
          <input id="schLib" type="text" spellcheck="false" placeholder="E:\EDA2Altium\library\MyLib.SchLib">
          <button id="browse-schLib" class="browse" type="button">浏览…</button>
        </div>
        <div class="saved-row">
          <select id="schLibSaved" aria-label="常用原理图库">
            <option value="">常用 SchLib…</option>
          </select>
          <button id="save-schLib" class="link" type="button">保存当前</button>
          <button id="del-schLib" class="link" type="button">删除</button>
        </div>
      </div>

      <div class="field">
        <label for="pcbLib">目标封装库 PcbLib</label>
        <div class="path-row">
          <input id="pcbLib" type="text" spellcheck="false" placeholder="E:\EDA2Altium\library\MyLib.PcbLib">
          <button id="browse-pcbLib" class="browse" type="button">浏览…</button>
        </div>
        <div class="saved-row">
          <select id="pcbLibSaved" aria-label="常用封装库">
            <option value="">常用 PcbLib…</option>
          </select>
          <button id="save-pcbLib" class="link" type="button">保存当前</button>
          <button id="del-pcbLib" class="link" type="button">删除</button>
        </div>
      </div>
    </div>
    <p id="path-status" class="hint" hidden></p>
    <div class="row">
      <button id="reset-paths" class="link" type="button">恢复默认路径</button>
    </div>
    <div class="options">
      <label class="chk"><input id="keepDocs" type="checkbox"> 保留 SchDoc / PcbDoc</label>
      <label class="chk"><input id="makePartLibs" type="checkbox"> 生成单件 SchLib / PcbLib</label>
    </div>
    <p class="hint">选中的文件保存到 <code>&lt;输出目录&gt;\元件名\</code>；其他中间文件自动清理。</p>
  </section>

  <section class="card">
    <h2><span class="num">3</span>生成</h2>
    <div class="row">
      <button id="build-btn" class="primary" type="button">生成（无浏览器 + Altium 脚本）</button>
      <span id="job-state" class="badge" hidden></span>
      <span id="job-id" class="hint mono"></span>
    </div>
    <p class="hint">可保持 Altium 打开；有未保存文档请先 Ctrl+S。</p>
    <div id="job-counts" class="counts" hidden></div>
    <div id="build-error" class="error" hidden></div>

    <div id="steps" class="steps" hidden></div>

    <div class="log-wrap">
      <div class="log-head">
        <h3>实时日志</h3>
        <div class="log-tools">
          <label class="chk"><input id="log-follow" type="checkbox" checked> 自动滚动</label>
          <button id="log-copy" class="link" type="button">复制日志</button>
        </div>
      </div>
      <div id="log" class="log"><span class="log-line dim">（尚未开始）</span></div>
    </div>

    <div class="art-wrap">
      <h3>产物</h3>
      <ul id="artifacts" class="artifacts"><li class="hint">尚无产物</li></ul>
    </div>
  </section>

</main>

<script src="/app.js"></script>
</body>
</html>
